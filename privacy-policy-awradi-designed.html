<script>
const texts={"ar": "نحترم خصوصيتك. توضح هذه السياسة البيانات والأذونات التي يتعامل معها تطبيق أورادي:\n\n• لا يطلب التطبيق إنشاء حساب أو تسجيل الدخول، ولا يستخدم الإعلانات أو أدوات التتبّع أو التحليلات. ولا يرسل نصوص صلواتك وأورادك أو تفضيلاتك إلى المطوّر.\n• يستخدم التطبيق إذن الوصول إلى الإنترنت حصراً للتحقق من استجابة رابطين خارجيين اختياريين قبل فتحهما: فيديو على YouTube وصفحة مصدر على موقع alkadriaalalia.com. لا يحدث الفحص إلا بعد ضغطك على الرابط وموافقتك على المتابعة. يرسل التطبيق طلباً فنياً من نوع HTTP HEAD إلى الموقع المعني لمعرفة رمز الاستجابة؛ وقد يتلقى خادم الموقع عنوان IP العام لجهازك ومعلومات الاتصال الفنية المعتادة. لا يرسل التطبيق نصوصك أو إعداداتك إلى هذين الموقعين. إذا أعاد الخادم الرمز 404 أو 410، يعطّل التطبيق زر الرابط ويحفظ حالة التعطيل على جهازك. أما انقطاع الشبكة أو فشل الاتصال المؤقت فلا يُعدّ دليلاً على تعطل الرابط ولا يؤدي إلى تعطيل الزر.\n• بعد الفحص، يفتح الرابط المختار في المتصفح أو التطبيق الخارجي المناسب، ولا يعرض التطبيق تلك المواقع داخل صفحة ويب مدمجة. كما أن رابط واتساب يفتح تطبيقاً خارجياً أو المتصفح عند ضغطك عليه. عند استخدام هذه الخدمات، تخضع أي بيانات تتعامل معها لسياسات الخصوصية الخاصة بمقدّميها.\n• الصلوات والأوراد والنصوص والترجمات مضمّنة محلياً في ملفات التطبيق وتُقرأ من جهازك دون اتصال بالإنترنت.\n• يستخدم التطبيق إذن الإشعارات الاختياري لعرض تذكيرات الأوراد عندما تختار تفعيلها. وعلى Android 13 وما بعده، يطلب النظام موافقتك على الإشعارات عند الحاجة.\n• يستخدم التطبيق إذن استقبال اكتمال تشغيل الهاتف لإعادة جدولة التذكيرات التي فعّلتها بعد إعادة تشغيل الجهاز أو تحديث التطبيق. تُجدول التذكيرات محلياً على هاتفك ولا تُرسل إلى خادم.\n• تُحفظ تفضيلاتك، مثل اللغة والمظهر والخط وحجم النص وسماكته والأدعية المثبّتة ومواضع القراءة المحفوظة وإعدادات التذكير، في مساحة التطبيق على جهازك. يمكنك حذف البيانات المحلية بمسح بيانات التطبيق أو إلغاء تثبيته.\n• يسمح إعداد Android بالنسخ الاحتياطي لبيانات التطبيق؛ لذلك قد يضمّن Android بعض بياناته في النسخ الاحتياطي للجهاز إذا كانت الميزة مفعّلة في إعدادات النظام. تُدار هذه النسخ بواسطة Android وإعدادات حسابك، ولا يستطيع التطبيق أو مطوّره الاطلاع عليها من داخل التطبيق.\n• عند الضغط على بريد المطوّر، يفتح التطبيق برنامج البريد في هاتفك فقط. لا يرسل التطبيق رسالة تلقائياً؛ ولا تُرسل أي معلومات بالبريد إلا ما تختار أنت كتابته وإرساله.\n\nلا يستخدم التطبيق خوادم خاصة به ولا يرسل بيانات الاستخدام إلى المطوّر، ولا يتضمن إعلانات أو أدوات تحليل أو تتبّع. يقتصر الاتصال الشبكي الذي يجريه التطبيق على فحص الرابطين الموضحين أعلاه عند طلبك ذلك. وإذا تغيرت طريقة عمل التطبيق أو هذه السياسة فسيُوضح ذلك في تحديث لاحق. للاستفسار، تواصل مع المطوّر عبر البريد الظاهر في «معلومات المطوّر».", "en": "We respect your privacy. This policy explains the data and permissions used by My Awrād:\n\n• The app does not ask you to create an account or sign in. It does not use advertising, tracking tools or analytics, and it does not send the text of your prayers, awrad or your preferences to the developer.\n• The app uses the Internet permission only to check the availability of two optional external links before opening them: a YouTube video and a source page on alkadriaalalia.com. The check runs only after you tap the link and confirm that you want to continue. The app sends a technical HTTP HEAD request to the relevant website to read its response status. The website server may receive your device’s public IP address and ordinary connection/request metadata. The app does not send your prayer texts or settings to these websites. If the server returns status 404 or 410, the app disables that link button and stores the disabled state locally on your device. A temporary network failure or connection error is not treated as proof that the link is broken and does not disable the button.\n• After the check, the selected link is opened in the appropriate external browser or app; the app does not display these websites in an embedded web page. The WhatsApp link also opens an external app or browser when you tap it. Any data handled by those services is subject to their own privacy policies.\n• Prayers, awrad, texts and translations are included locally in the app files and are read on your device offline.\n• The app uses the optional notification permission to display awrad reminders when you choose to enable them. On Android 13 and later, the system asks for your notification permission when needed.\n• The receive-boot-completed permission is used to reschedule reminders you enabled after the device restarts or the app is updated. Reminders are scheduled locally on your phone and are not sent to a server.\n• Your preferences—language, appearance, font, text size and weight, pinned prayers, saved reading positions and reminder settings—are stored in the app’s on-device storage. You can remove local data by clearing the app’s data or uninstalling it.\n• Android backup is enabled for the app, so Android may include some app data in a device backup when backup is enabled in system settings. Those backups are managed by Android and your account settings; the app and its developer cannot access them through the app.\n• When you tap the developer’s email address, your email app opens. The app does not send a message automatically; no information is sent by email unless you choose to write and send it.\n\nThe app does not operate its own servers and does not send usage data to the developer. It contains no advertising, analytics or tracking tools. The app’s own network activity is limited to checking the two links described above when you request it. Any change to the app’s behavior or this policy will be described in a future app update. For questions, contact the developer at the email address shown in “Developer information”.", "fr": "Nous respectons votre vie privée. Cette politique explique les données et les autorisations utilisées par My Awrād :\n\n• L’application ne demande ni création de compte ni connexion. Elle n’utilise ni publicité, ni outil de suivi, ni outil d’analyse, et elle n’envoie pas au développeur le texte de vos prières, de vos awrad ou vos préférences.\n• L’application utilise l’autorisation Internet uniquement pour vérifier la disponibilité de deux liens externes facultatifs avant de les ouvrir : une vidéo YouTube et une page source sur alkadriaalalia.com. La vérification n’a lieu qu’après avoir appuyé sur le lien et confirmé votre choix. L’application envoie une requête technique HTTP HEAD au site concerné afin de lire son code de réponse. Le serveur du site peut recevoir l’adresse IP publique de votre appareil ainsi que les métadonnées techniques habituelles de la connexion et de la requête. L’application n’envoie pas vos textes de prières ni vos paramètres à ces sites. Si le serveur renvoie le code 404 ou 410, l’application désactive le bouton du lien et enregistre cet état localement sur votre appareil. Une panne temporaire du réseau ou une erreur de connexion n’est pas considérée comme une preuve que le lien est invalide et ne désactive pas le bouton.\n• Après la vérification, le lien choisi s’ouvre dans le navigateur ou l’application externe approprié ; l’application n’affiche pas ces sites dans une page Web intégrée. Le lien WhatsApp ouvre également une application externe ou un navigateur lorsque vous appuyez dessus. Les données traitées par ces services sont soumises à leurs propres politiques de confidentialité.\n• Les prières, les awrad, les textes et leurs traductions sont inclus localement dans les fichiers de l’application et sont consultés sur votre appareil, hors ligne.\n• L’application utilise l’autorisation facultative de notification pour afficher les rappels des awrad lorsque vous choisissez de les activer. Sur Android 13 et versions ultérieures, le système demande votre autorisation lorsque cela est nécessaire.\n• L’autorisation de réception du démarrage du téléphone sert à reprogrammer les rappels activés après le redémarrage ou la mise à jour de l’application. Les rappels sont programmés localement sur votre téléphone et ne sont pas envoyés à un serveur.\n• Vos préférences — langue, apparence, police, taille et graisse du texte, prières épinglées, positions de lecture et réglages des rappels — sont enregistrées dans l’espace de l’application sur votre appareil. Vous pouvez supprimer les données locales en effaçant les données de l’application ou en la désinstallant.\n• Android autorise la sauvegarde des données de l’application. Certaines données peuvent donc être incluses dans la sauvegarde de l’appareil si cette fonction est activée dans les paramètres système. Ces sauvegardes sont gérées par Android et les paramètres de votre compte ; l’application et son développeur n’y ont pas accès depuis l’application.\n• Lorsque vous appuyez sur l’adresse e-mail du développeur, votre application de messagerie s’ouvre. L’application n’envoie aucun message automatiquement ; aucune information n’est envoyée par e-mail sauf ce que vous choisissez de rédiger et d’envoyer.\n\nL’application n’exploite pas ses propres serveurs et ne transmet pas vos données d’utilisation au développeur. Elle ne contient ni publicité, ni outil d’analyse, ni outil de suivi. L’activité réseau propre à l’application se limite à la vérification des deux liens décrits ci-dessus, lorsque vous le demandez. Toute modification du fonctionnement de l’application ou de cette politique sera signalée dans une future mise à jour. Pour toute question, contactez le développeur à l’adresse indiquée dans « Informations sur le développeur ».", "id": "Kami menghormati privasi Anda. Kebijakan ini menjelaskan data dan izin yang digunakan My Awrād:\n\n• Aplikasi tidak meminta Anda membuat akun atau masuk. Aplikasi tidak menggunakan iklan, alat pelacakan, atau analitik, dan tidak mengirimkan teks doa, wirid, maupun preferensi Anda kepada pengembang.\n• Aplikasi menggunakan izin Internet hanya untuk memeriksa ketersediaan dua tautan eksternal opsional sebelum membukanya: video YouTube dan halaman sumber di alkadriaalalia.com. Pemeriksaan hanya dilakukan setelah Anda mengetuk tautan dan mengonfirmasi untuk melanjutkan. Aplikasi mengirim permintaan teknis HTTP HEAD ke situs terkait untuk membaca status responsnya. Server situs tersebut dapat menerima alamat IP publik perangkat Anda serta metadata koneksi dan permintaan yang biasa. Aplikasi tidak mengirim teks doa atau pengaturan Anda ke situs-situs tersebut. Jika server mengembalikan status 404 atau 410, aplikasi menonaktifkan tombol tautan dan menyimpan status nonaktif itu secara lokal di perangkat Anda. Gangguan jaringan atau kesalahan koneksi sementara tidak dianggap sebagai bukti bahwa tautan rusak dan tidak akan menonaktifkan tombol.\n• Setelah pemeriksaan, tautan yang dipilih dibuka di browser atau aplikasi eksternal yang sesuai; aplikasi tidak menampilkan situs tersebut di halaman web tertanam. Tautan WhatsApp juga membuka aplikasi eksternal atau browser saat Anda mengetuknya. Data apa pun yang diproses oleh layanan tersebut tunduk pada kebijakan privasi mereka sendiri.\n• Doa, wirid, teks, dan terjemahan disertakan secara lokal dalam berkas aplikasi dan dibaca di perangkat Anda secara offline.\n• Aplikasi menggunakan izin notifikasi opsional untuk menampilkan pengingat wirid saat Anda memilih mengaktifkannya. Pada Android 13 ke atas, sistem meminta izin notifikasi Anda saat diperlukan.\n• Izin menerima selesai boot digunakan untuk menjadwalkan ulang pengingat yang Anda aktifkan setelah perangkat dihidupkan ulang atau aplikasi diperbarui. Pengingat dijadwalkan secara lokal di ponsel Anda dan tidak dikirim ke server.\n• Preferensi Anda—bahasa, tampilan, huruf, ukuran dan ketebalan teks, doa yang disematkan, posisi bacaan yang tersimpan, dan pengaturan pengingat—disimpan di penyimpanan aplikasi pada perangkat. Anda dapat menghapus data lokal dengan menghapus data aplikasi atau mencopot pemasangannya.\n• Pencadangan Android diaktifkan untuk aplikasi ini, sehingga Android dapat menyertakan sebagian data aplikasi dalam cadangan perangkat bila pencadangan diaktifkan di pengaturan sistem. Cadangan tersebut dikelola oleh Android dan pengaturan akun Anda; aplikasi dan pengembangnya tidak dapat mengaksesnya melalui aplikasi.\n• Saat Anda mengetuk alamat email pengembang, aplikasi email Anda terbuka. Aplikasi tidak mengirim pesan secara otomatis; tidak ada informasi yang dikirim melalui email kecuali Anda memilih untuk menulis dan mengirimnya.\n\nAplikasi tidak mengoperasikan server sendiri dan tidak mengirimkan data penggunaan kepada pengembang. Aplikasi tidak berisi iklan, analitik, atau alat pelacakan. Aktivitas jaringan aplikasi hanya terbatas pada pemeriksaan dua tautan yang dijelaskan di atas ketika Anda memintanya. Setiap perubahan pada perilaku aplikasi atau kebijakan ini akan dijelaskan dalam pembaruan aplikasi di masa depan. Untuk pertanyaan, hubungi pengembang melalui alamat email yang tertera di “Informasi pengembang”.", "tr": "Gizliliğinize saygı duyuyoruz. Bu politika, My Awrād uygulamasının kullandığı verileri ve izinleri açıklar:\n\n• Uygulama sizden hesap oluşturmanızı veya giriş yapmanızı istemez. Reklam, izleme aracı veya analiz kullanmaz; dualarınızın, evrâd metinlerinizin ya da tercihlerinizin içeriğini geliştiriciye göndermez.\n• Uygulama, açmadan önce yalnızca iki isteğe bağlı harici bağlantının kullanılabilirliğini kontrol etmek için İnternet iznini kullanır: bir YouTube videosu ve alkadriaalalia.com adresindeki bir kaynak sayfası. Kontrol, yalnızca bağlantıya dokunup devam etmeyi onayladığınızda yapılır. Uygulama, yanıt durum kodunu öğrenmek için ilgili web sitesine teknik bir HTTP HEAD isteği gönderir. Site sunucusu cihazınızın genel IP adresini ve olağan bağlantı/istek teknik üst verilerini alabilir. Uygulama dua metinlerinizi veya ayarlarınızı bu sitelere göndermez. Sunucu 404 veya 410 durum kodunu döndürürse uygulama bağlantı düğmesini devre dışı bırakır ve bu durumu cihazınıza yerel olarak kaydeder. Geçici ağ kesintisi veya bağlantı hatası, bağlantının bozuk olduğunun kanıtı sayılmaz ve düğmeyi devre dışı bırakmaz.\n• Kontrolden sonra seçilen bağl const titles={ar:'سياسة الخصوصية',en:'Privacy policy',fr:'Politique de confidentialité',id:'Kebijakan privasi',tr:'Gizlilik politikası'};

function show(lang){
 document.documentElement.lang=lang;document.documentElement.dir=dirs[lang];
 document.getElementById('pageTitle').textContent=titles[lang];
 const policy=document.getElementById('policy');policy.replaceChildren();policy.dir=dirs[lang];
 const paragraphs=texts[lang].split('\n\n').filter(Boolean);
 const intro=document.createElement('div');intro.className='policy-intro';intro.textContent=paragraphs[0]||'';intro.dir=dirs[lang];policy.appendChild(intro);
 const items=paragraphs.slice(1,-1).flatMap(block=>block.split('\n').filter(Boolean));
 items.forEach(line=>{const el=document.createElement('div');el.className='policy-item';el.textContent=line;el.dir=dirs[lang];policy.appendChild(el);});
 const closing=document.createElement('div');closing.className='policy-closing';closing.textContent=paragraphs[paragraphs.length-1]||'';closing.dir=dirs[lang];policy.appendChild(closing);
 document.querySelector('.lang-label').lastChild.textContent=lang==='ar'?'اللغة':lang==='fr'?'Langue':lang==='tr'?'Dil':lang==='id'?'Bahasa':'Language';
 document.getElementById('contactLabel').textContent=lang==='ar'?'للتواصل مع المطوّر:':lang==='fr'?'Contacter le développeur :':lang==='tr'?'Geliştiriciyle iletişim:':lang==='id'?'Hubungi pengembang:':'Contact the developer:';
 document.querySelector('footer').style.direction=dirs[lang];
}
const select=document.getElementById('lang');select.addEventListener('change',()=>show(select.value));show('ar');
